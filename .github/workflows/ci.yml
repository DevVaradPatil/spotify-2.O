name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. The app reads these at request time, so
          # they only need to be well-formed, not real.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Reports high/critical advisories in runtime dependencies.
      #
      # Non-blocking for now, deliberately: the only two that remain are
      # `next` and its bundled `postcss`, and neither has a fix below Next
      # 16.x, which is a semver-major upgrade tracked as CQ-12 in
      # IMPROVEMENT_PLAN.md. Flip continue-on-error off the moment that
      # upgrade lands, so the gate starts biting again.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
